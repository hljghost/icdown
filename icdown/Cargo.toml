[package]
name = "icdown"
version = "0.2.0"
edition = "2021"

[lib]
name = "icdown"
path = "src/lib.rs"

[[bin]]
name = "icdown"
path = "src/main.rs"

[[bin]]
name = "icdown-tray"
path = "src/bin/icdown-tray.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
ed25519-dalek = "2"
fs2 = "0.4"
hex = "0.4"
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = "0.15"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tao = "0.30"
tray-icon = { version = "0.19", default-features = false }

[dev-dependencies]
getrandom = "0.2"
png = "0.17"
tempfile = "3"
